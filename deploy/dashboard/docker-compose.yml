# DreamWeave ACE.Dashboard - read-only analytics reader.
#
# Versioned as of the OVH migration. It previously existed only on the host, like the
# monitoring compose files did, so it had no history and no review path.
#
# Deploy: copy this directory beside the others on the host, fill in .env from
# .env.template, then `docker compose up -d`. Reach it with `ssh -L 5080:127.0.0.1:5080`.

services:

  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/awful-waffle-rofl/waffleace-dashboard:latest}
    container_name: dreamweave-dashboard
    restart: unless-stopped
    environment:
      # The published image's baked /app/appsettings.json pins
      #   Kestrel:Endpoints:Http:Url = http://127.0.0.1:5080
      # which binds the CONTAINER's loopback. Nothing outside the container can then reach
      # it, so the `127.0.0.1:5080->8080` mapping below could never connect and the
      # dashboard answered with a connection failure on every host it was ever deployed to.
      #
      # Environment configuration outranks appsettings.json, so this rebinds it to all
      # interfaces INSIDE the container - still private, because the port mapping is
      # loopback-only and the host firewall drops 5080 from the WAN regardless.
      #
      # This is a WORKAROUND. The proper fix is to stop hardcoding a loopback bind in the
      # image (Source/ACE.Dashboard) and rebuild; when that lands, drop this line.
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - Analytics__ConnectionString=Server=ace-db;Port=3306;Database=ace_analytics;User=dashboard_ro;Password=${DASHBOARD_DB_PASSWORD};SslMode=None;AllowPublicKeyRetrieval=True
      - Dashboard__Username=${DASHBOARD_USER:-admin}
      - Dashboard__Password=${DASHBOARD_PASSWORD}
    networks:
      - stage-net
    ports:
      # Loopback only. Never publish this on 0.0.0.0 - it is a database reader.
      - "127.0.0.1:5080:8080"
    mem_limit: 256m

networks:
  # Joins the stage compose project's network to resolve `ace-db` for ace_analytics.
  stage-net:
    external: true
    name: dreamweave-stage_default
